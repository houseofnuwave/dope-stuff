name: Dope Stuff quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx playwright
      - name: Compile backend and tools
        run: python -m compileall -q app tools
      - name: Validate front-end JavaScript
        run: node --check app/static/app.js
      - name: Run isolated backend tests
        run: python -m pytest -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile seller journeys
        run: python tools/ui_smoke.py
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual application image
        run: docker build --tag dope-stuff-container-ci .
      - name: Start disposable container without external networking or host volumes
        run: >-
          docker run --detach --name dope-stuff-container-ci --network none
          --env FORM_CONTAINER_SMOKE_ALLOW_SYNTHETIC=YES_DISPOSABLE_CONTAINER
          dope-stuff-container-ci
      - name: Real HTTP workflow and packaged migration CLI
        run: |
          docker exec dope-stuff-container-ci python -m tools.container_smoke
          docker exec dope-stuff-container-ci python -m tools.migrate
      - name: Remove only the disposable CI container
        if: always()
        run: docker rm --force dope-stuff-container-ci || true
  cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: form
          POSTGRES_PASSWORD: form_ci_password
          POSTGRES_DB: form_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U form -d form_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FORM_ENV: test
      FORM_DATABASE_URL: postgresql://form:form_ci_password@localhost:5432/form_ci_test
      FORM_PHOTO_STORAGE: s3
      FORM_S3_ENDPOINT: http://127.0.0.1:9000
      FORM_S3_BUCKET: form-ci-temp
      FORM_S3_PREFIX: ci/github
      FORM_S3_REGION: us-east-1
      FORM_S3_ACCESS_KEY_ID: formci
      FORM_S3_SECRET_ACCESS_KEY: form_ci_test_secret
      FORM_CLOUD_SMOKE_ALLOW_DELETE: YES_ISOLATED_TEST_ENV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.8'
          cache: false
      - name: Build pinned upstream MinIO for isolated CI storage
        env:
          GOBIN: ${{ runner.temp }}/minio-bin
        run: go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
      - name: Start isolated MinIO object storage
        env:
          MINIO_ROOT_USER: formci
          MINIO_ROOT_PASSWORD: form_ci_test_secret
        run: |
          nohup "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:9000/minio/health/ready
      - name: Cloud integration smoke (PostgreSQL + private S3)
        run: python -m tools.cloud_smoke
